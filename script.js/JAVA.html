<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Java script handling</h2>
    <p>This demonstrates how <b>catch</b> works</p>
    <p id="error_message"></p>
    <script>
        try {
            addalert("welcome guests!")
        }
        catch(err) {
            document.getElementById("error_message").innerHTML = err.message;
        }
    </script>

    
</body>
</html>
