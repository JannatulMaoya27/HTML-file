<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Website</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
        }

         nav{
            background:#333;
            padding:15px;
        }


       
        nav a{
            color:white;
            text-decoration:none;
            margin-right:20px;
        }

        .banner{
            background:#f4a261;
            color:white;
            text-align:center;
            padding:50px;
        }

        .about{
            padding:20px;
            text-align:center;
        }

        .portfolio{
            display:flex;
            justify-content:center;
            gap:20px;
            padding:20px;
        }

        .item{
            border:1px solid #ccc;
            padding:10px;
            width:150px;
            text-align:center;
        }

        img{
            width:100%;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
    </nav>

    <div class="banner">
        <h1>Delicious Restaurant</h1>
        <p>Welcome to our restaurant</p>
    </div>

    <div class="about">
        <h2>About Us</h2>
        <p>We serve fresh and tasty food every day.</p>
    </div>

    <div class="portfolio">
        <div class="item">
            
            <h3>Pizza</h3>
        </div>

        <div class="item">
            
            <h3>Burger</h3>
        </div>

        <div class="item">
            
            <h3>Pasta</h3>
        </div>
    </div>

</body>
</html>
