<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sticky example</title>
<head>
    
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            position: sticky;
            top: 0;

            background: orange;
            padding: 20px;
        }

        .content {
            height: 2000px;
            padding: 20px;
        }
    </style> 
<body>
    <div style="height:300px; background: lightblue;">
      Scroll until the orange bar reaches the top.
    </div>

    <div class="header">
      Sticky Header
    </div>

    <div class="content">
      <h1>Scroll Down</h1>
    </div>

  

</body>

   
</head>

</head>

</body>
</html>
