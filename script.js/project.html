<script>

var seconds = 0;

setInterval(function () {

seconds = seconds + 1;

document.getElementById("timer").textContent = "You have been here for " + seconds + " seconds!";

}, 1000);

function checkForm() {

var name = document.getElementById("name").value;

var guess = document.getElementById("guess").value;

var ok = true;

if (name == "") {

document.getElementById("msg-name").textContent = "Please enter your name!";

document.getElementById("msg-name").style.color = "red";

ok = false;

} else {

document.getElementById("msg-name").textContent = "Great name!";

document.getElementById("msg-name").style.color = "green";

}

if (guess == "") {

document.getElementById("msg-guess").textContent = "Please enter a guess!";

document.getElementById("msg-guess").style.color = "red";

ok = false;

} else {

document.getElementById("msg-guess").textContent = "Guess saved!";

document.getElementById("msg-guess").style.color = "green";

}

if (ok == true) {

var lucky = Math.floor(Math.random() * 5) + 1;

if (guess == lucky) {

document.getElementById("result").textContent = "You win, " + name + "! The lucky number was " + lucky + "!";

document.getElementById("result").style.color = "green";

} else {

document.getElementById("result").textContent = "So close, " + name + "! The lucky number was " + lucky + ". Try again!";

document.getElementById("result").style.color = "navy";

}

}

}

</script>
<div style="border: 1px solid #ccc; padding: 20px; width: 300px; border-radius: 8px;">

<h3>OTP Verification with Timer</h3>

<button id="sendOtpBtn">Send OTP</button>

<p id="otpDisplay" style="font-weight: bold; color: blue;"></p>

<p id="timerDisplay" style="color: red; font-weight: bold;"></p>

<input type="text" id="otpInput" placeholder="Enter 4-digit OTP" maxlength="4">

<button id="verifyBtn">Verify</button>

<p id="resultFeedback"></p>

</div>

<script>

let generatedOtp = null;

let countdownInterval = null; // Variable to store our interval ID

let timeLeft = 0; // Tracks remaining seconds

const otpDisplay = document.getElementById('otpDisplay');

const timerDisplay = document.getElementById('timerDisplay');

const otpInput = document.getElementById('otpInput');

const resultFeedback = document.getElementById('resultFeedback');

// Triggered when user clicks "Send OTP"

document.getElementById('sendOtpBtn').addEventListener('click', function () {

// 1. Clear any active background timers from previous clicks

clearInterval(countdownInterval);

// 2. Generate the OTP

generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();

otpDisplay.textContent = "Your OTP is: " + generatedOtp;

resultFeedback.textContent = "";

otpInput.value = "";



// 3. Set timer for 15 seconds

timeLeft = 15;

timerDisplay.textContent = `Time remaining: ${timeLeft}s`;

// 4. Start setInterval to count down every 1 second (1000ms)

countdownInterval = setInterval(function () {

timeLeft--;

timerDisplay.textContent = `Time remaining: ${timeLeft}s`;

// Condition: What happens when time runs out?

if (timeLeft <= 0) {

clearInterval(countdownInterval); // Stop the interval timer

generatedOtp = null; // Destroy the OTP so it's no longer valid

otpDisplay.textContent = "OTP Expired!";

timerDisplay.textContent = "";

}

}, 1000);

});

// Triggered when user clicks "Verify"

document.getElementById('verifyBtn').addEventListener('click', function () {

const userEnteredOtp = otpInput.value;

if (generatedOtp === null) {

resultFeedback.textContent = "Code invalid or expired. Please request a new one.";

resultFeedback.style.color = "red";

} else if (userEnteredOtp === generatedOtp) {

clearInterval(countdownInterval); // Stop the timer immediately on success

timerDisplay.textContent = "";

resultFeedback.textContent = "Success! Access Granted.";

resultFeedback.style.color = "green";

} else {

resultFeedback.textContent = "Wrong OTP. Try again.";

resultFeedback.style.color = "red";

}

});

</script>
